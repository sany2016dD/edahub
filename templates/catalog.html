<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Каталог магазинов — Яндекс Еда</title>
<script src="https://api-maps.yandex.ru/2.1/?apikey=c0d403ab-e5be-4049-908c-8122a58acf23&lang=ru_RU" type="text/javascript"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/catalog.css">
</head>
<body>
<div class="topbar">
  <div class="wrap">
    <h1>Каталог магазинов — Яндекс Еда</h1>
    <a href="/">← Админка</a>
  </div>
</div>

<div class="wrap">

  <section class="card">
    <h2>Парсер магазина</h2>
    <div class="row">
      <div>
        <label>Аккаунт Яндекса Еды</label>
        <select id="catAccount"></select>
      </div>
      <div style="flex:2">
        <label>Адрес доставки</label>
        <div class="aswrap">
          <input id="catAddr" placeholder="например: Омск, проспект Мира, 56" autocomplete="off">
          <div id="addrSuggest" class="asbox hidden"></div>
        </div>
      </div>
      <div style="flex:0 0 auto">
        <button class="btn" id="catFind">Найти магазины</button>
      </div>
    </div>
    <div id="catFindRes"></div>
    <div id="catErr" class="error hidden"></div>
  </section>

  <section class="card hidden" id="catShopsCard">
    <h2>Магазины по адресу <span class="mut" id="catAddrLabel"></span></h2>
    <p class="note">Нажмите на магазин, чтобы запустить парсинг всех категорий и товаров.</p>
    <div class="shgrid" id="catShops"></div>
  </section>

  <section class="card hidden" id="catProgressCard">
    <h3 id="catProgressTitle">Парсинг…</h3>
    <div class="progress"><i id="catProgressBar"></i></div>
    <div class="pmsg" id="catProgressMsg"></div>
  </section>

  <section class="card hidden" id="catResultsCard">
    <h2>Сохранённые каталоги</h2>
    <div class="chips" id="catStores"></div>
    <div id="catView"></div>
  </section>

</div>

<script src="/static/catalog.js"></script>
</body>
</html>
