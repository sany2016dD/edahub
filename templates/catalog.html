<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Каталог магазинов — Яндекс Еда</title>
<script src="https://api-maps.yandex.ru/2.1/?apikey=c0d403ab-e5be-4049-908c-8122a58acf23&lang=ru_RU" type="text/javascript"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F5F4F2;--card:#fff;--ink:#21201F;--ink2:#7a7773;--line:#e8e6e4;
  --green:#029154;--green-bg:#e7f6ef;--red:#e52322;
}
body{font-family:'Manrope',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#fff;color:var(--ink)}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px 60px}
.topbar{position:sticky;top:0;z-index:20;background:var(--green);color:#fff;padding:14px 0;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;padding-bottom:0}
.topbar h1{font-size:19px;font-weight:800}
.topbar a{color:#fff;font-size:13px;font-weight:600;opacity:.9;text-decoration:none}
.topbar a:hover{opacity:1}
section.card{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-top:18px;padding:18px}
h2{font-size:16px;font-weight:800;margin-bottom:12px}
h3{font-size:14px;font-weight:800;margin-bottom:8px}
.mut{color:var(--ink2);font-size:13px}
.hidden{display:none!important}
label{display:block;font-size:12px;color:var(--ink2);margin-bottom:6px;font-weight:600}
input,select{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:12px;font-size:14px;color:var(--ink);background:#fff;font-family:inherit;outline:none}
input:focus,select:focus{border-color:var(--green)}
.aswrap{position:relative}
.asbox{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:30;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(33,32,31,.16);max-height:55vh;overflow:auto;padding:6px}
.asbox.hidden{display:none}
.as-box-suggest{display:flex;align-items:flex-start;gap:9px;padding:9px 10px;cursor:pointer;font-size:13.5px;border:none;background:none;width:100%;text-align:left;font-family:inherit;color:var(--ink);border-radius:8px}
.as-box-suggest:hover{background:var(--bg)}
.as-box-suggest .pin{opacity:.45;flex-shrink:0}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.row>div{flex:1;min-width:180px}
.btn{display:inline-block;padding:11px 18px;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;background:var(--green);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:8px 12px;font-size:12.5px}
.btn:disabled{opacity:.55}
/* магазины */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:14px}
.shop{display:flex;flex-direction:column;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;transition:.15s;text-align:left;font-family:inherit;color:var(--ink);position:relative}
.shop:hover{border-color:var(--green);box-shadow:0 4px 14px rgba(2,145,84,.12)}
.shop img,.shop .noimg{width:100%;height:120px;object-fit:cover;border-radius:10px;background:var(--bg)}
.shop .noimg{display:flex;align-items:center;justify-content:center;color:var(--ink2);font-size:30px}
.shop b{font-size:15px;font-weight:800}
.shop .meta{font-size:12.5px;color:var(--ink2);display:flex;flex-direction:column;gap:2px}
.shop .star{color:var(--green);font-weight:800}
/* прогресс */
.progress{height:8px;background:var(--bg);border-radius:6px;overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;background:var(--green);width:0%;transition:width .3s}
.pmsg{font-size:13px;color:var(--ink2);margin-top:6px}
/* магазины-чипы */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink)}
.chip.active{background:var(--green);border-color:var(--green);color:#fff}
.chip .x{opacity:.7;margin-left:2px}
/* товары */
.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:4px}
.controls label{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;color:var(--ink);margin:0;cursor:pointer}
.controls input[type=checkbox]{width:auto}
.controls select{width:auto;min-width:220px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin-top:14px}
.pcard{position:relative;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.pcard .ph{position:relative}
.pcard img,.pcard .noimg{width:100%;height:150px;object-fit:cover;background:var(--bg)}
.pcard .badge{position:absolute;top:8px;left:8px;background:var(--green);color:#fff;font-size:12px;font-weight:800;padding:3px 8px;border-radius:8px}
.pcard .pcat{font-size:11px;color:var(--ink2);padding:8px 10px 0}
.pcard .pn{font-size:13.5px;font-weight:700;line-height:1.25;padding:4px 10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:34px}
.pcard .pw{font-size:12px;color:var(--ink2);padding:0 10px}
.pcard .pp{display:flex;align-items:baseline;gap:8px;padding:10px;margin-top:auto}
.pcard .old{font-size:13px;color:var(--ink2);text-decoration:line-through}
.pcard .new{font-size:18px;font-weight:800;color:var(--red)}
.pcard .no-disc{font-size:15px;font-weight:700}
.empty{text-align:center;color:var(--ink2);padding:30px 0;font-size:14px}
.error{color:var(--red);font-size:13.5px;background:#fdecec;border:1px solid #f5c6c6;border-radius:10px;padding:10px 12px;margin-top:10px}
.note{font-size:12.5px;color:var(--ink2);margin-top:8px;line-height:1.5}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="topbar">
  <div class="wrap">
    <h1>Каталог магазинов — Яндекс Еда</h1>
    <a href="/">← Админка</a>
  </div>
</div>

<div class="wrap">

  <section class="card">
    <h2>Парсер магазина</h2>
    <div class="row">
      <div>
        <label>Аккаунт Яндекса Еды</label>
        <select id="catAccount"></select>
      </div>
      <div style="flex:2">
        <label>Адрес доставки</label>
        <div class="aswrap">
          <input id="catAddr" placeholder="например: Омск, проспект Мира, 56" autocomplete="off">
          <div id="addrSuggest" class="asbox hidden"></div>
        </div>
      </div>
      <div style="flex:0 0 auto">
        <button class="btn" id="catFind">Найти магазины</button>
      </div>
    </div>
    <div id="catFindRes"></div>
    <div id="catErr" class="error hidden"></div>
  </section>

  <section class="card hidden" id="catShopsCard">
    <h2>Магазины по адресу <span class="mut" id="catAddrLabel"></span></h2>
    <p class="note">Нажмите на магазин, чтобы запустить парсинг всех категорий и товаров.</p>
    <div class="grid" id="catShops"></div>
  </section>

  <section class="card hidden" id="catProgressCard">
    <h3 id="catProgressTitle">Парсинг…</h3>
    <div class="progress"><i id="catProgressBar"></i></div>
    <div class="pmsg" id="catProgressMsg"></div>
  </section>

  <section class="card hidden" id="catResultsCard">
    <h2>Сохранённые каталоги</h2>
    <div class="chips" id="catStores"></div>
    <div id="catView"></div>
  </section>

</div>

<script src="/static/catalog.js"></script>
</body>
</html>
